name: Keep backend awake

# ============================================================================
# Why this workflow exists
# ============================================================================
#
# The service runs on a free plan that stops the container after roughly
# fifteen minutes without traffic. Starting it again takes close to a minute,
# and that wait lands on whichever visitor happens to arrive first.
#
# A short ping every five minutes keeps the container running, so in normal use
# nobody meets a cold start at all.
#
# Five rather than fourteen because GitHub delays scheduled runs when its own
# queues are busy - often by ten minutes or more. A fourteen-minute cadence
# against a fifteen-minute idle timeout has no margin: one late run and the
# container sleeps. At five minutes, two runs in a row have to be lost before
# the service goes down. Minutes are free on a public repository, so the extra
# attempts cost nothing.
#
# Offset from the hour (03, 08, 13 ...) rather than on it, because the top of
# the hour is when every other cron on GitHub fires and is where the delays are
# worst.
#
# Active hours only, on purpose. The free plan includes 750 instance-hours a
# month; the window below is roughly 05:30 to 01:30 IST, about 600 hours a
# month, so the service is allowed to sleep overnight - when there is no one to
# inconvenience - and there is still headroom on the account.
#
# Still best effort, not a guarantee. The frontend also warms the backend on
# load and explains the wait, so a missed run degrades rather than breaks.
#
# One-time setup
# --------------
# Add a repository *variable* (not a secret) under
# Settings -> Secrets and variables -> Actions -> Variables:
#
#   BACKEND_URL = https://<your-service>.onrender.com     (no trailing slash)
#
# It is a public URL rather than a credential, which is why it is a variable.
# Until it is set the job skips itself instead of failing on every run.
# ============================================================================

on:
  schedule:
    # Every 5 minutes, offset from the hour, 00:00-19:59 UTC (~05:30-01:30 IST)
    - cron: "3-59/5 0-19 * * *"

  # Lets the service be woken by hand from the Actions tab
  workflow_dispatch:

# Read-only: this workflow only makes an outbound request
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest

    # No URL configured yet - skip quietly rather than fail on every run
    if: vars.BACKEND_URL != ''

    steps:
      - name: Ping health endpoint
        run: |
          # -m 120: the first call of the day IS the cold start, so it has to
          # be allowed to wait for the container to finish starting.
          # --retry-all-errors covers the 502 the host returns while starting.
          curl -fsS \
            -m 120 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            "${BACKEND_URL}/api/health"
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
